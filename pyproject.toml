[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "lab_analysis_system"
version = "0.1.0"
description = "Data processing and plotting pipeline for the lab"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pandas>=2.0",
    "matplotlib>=3.7",
    "numpy>=1.24",
    "scipy",
    "GitPython",
    "pytest",
    "pyarrow",
]

[project.scripts]
lab-analysis = "lab_analysis_system.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["."]


[project.entry-points."lab_analysis.instruments"]
frog_mesa = "lab_analysis_system.instruments.frog_mesa:FROGMesa"
osa_ando = "lab_analysis_system.instruments.osa_ando:OSAAndo"
rfa_agilent = "lab_analysis_system.instruments.rfa_agilent:RFAAgilent"
spect_aurora_4000 = "lab_analysis_system.instruments.spect_aurora_4000:SpectAurora4000"
spect_ocean_optics_uv = "lab_analysis_system.instruments.spect_ocean_optics_uv:SpectOceanOpticsUV"