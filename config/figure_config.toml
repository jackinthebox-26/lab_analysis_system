[info_box]
boxstyle = "round,pad=0.5"
facecolor = "white"
edgecolor = "grey"
alpha = 0.8
linewidth = 1.2
fontsize = 9
fontfamily = "monospace"
verticalalignment="top"
horizontalalignment="left"


[default_fig_settings]
figsize = [10, 4]
dpi = 100
color='C3'
tight_plot_window=2


[gaussian_plot]
color='black'
linestyle = '--'
label='Gaussian fit'


[osa_ando]
file_info = """
Type: OSA
Index: {exp_index:03d}
QWP: {QWP} deg
HWP1: {HWP1} deg
HWP2: {HWP2} deg
Pump current: {Pump current} mA
Center Wavelength (nm): {Center Wavelength (nm):.2f} nm
FWHM Wavelength (nm): {FWHM Wavelength (nm):.2f} nm
Notes: {Notes}
"""

xlabel="Wavelength (nm)"
ylabel="Normalized Linear Power (a.u.)"

[rfa_agilent]
file_info ="""
Type: RF 
Index: {exp_index:03d}
QWP: {QWP} deg
HWP1: {HWP1} deg
HWP2: {HWP2} deg
Pump current: {Pump current} mA
Notes: {Notes}
"""

xlabel='Frequency (Hz)'
ylabel='Power (dBm)'


[spect_aurora_4000]
file_info = """
Type: Aurora 4000
Device Name: {Device Name} 
Integral Time(s): {Integral Time(s)}
Avg Count: {Avg Count} 
Center Wavelength (nm): {Center Wavelength (nm):.2f} nm
FWHM Wavelength (nm): {FWHM Wavelength (nm):.2f} nm
Other Description: {Other Description}
"""

xlabel='Wavelength (nm)'
ylabel='Normalized Linear Power (a.u.)'


[spect_ocean_optics_uv]
file_info = """
Type: Ocean Optics
Device Name: {Spectrometer} 
Integral Time(s): {Integration Time (sec)}
Scans to average: {Scans to average} 
Center Wavelength (nm): {Center Wavelength (nm):.2f} nm
FWHM Wavelength (nm): {FWHM Wavelength (nm):.2f} nm
"""

xlabel='Wavelength (nm)'
ylabel='Normalized Linear Power (a.u.)'



[frog_mesa]
file_info = """
Type: FROG
Pulse Width: {pulse_width} {pulse_width_unit}
Bandwidth: {bandwidth} {bandwidth_unit}
TBW product (g: 0.441, sec2: 0.315): {tbw_product}
FROG trace error: {frog_trace_error}
Timestamp: {timestamp} 
"""